<section class="main-info">
  <div class="container main-info__container">
    <h1 hidden>Головна сторінка</h1>
    <h2 class="main-info__title" key="mainInfoTitle">Вітаю на Leaf Of Hope!</h2>
    <div class="main-info__block">
      <p class="main-info__text" key="mainInfoText">
        Наша ціль - поширювати та зберігати рідкісні кімнатні рослини.
        Запрошуємо вас приєднатися до нашої спільноти: додавайте свої рослини до
        віртуального саду та обмінюйтесь ними з іншими користувачами!
      </p>
      <picture class="main-info__img">
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-1440-1x.avif 1x,
            ./img/main/moneyTree/moneyTree-1440-2x.avif 2x
          "
          type="image/avif"
          media="(min-width: 1440px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-1440-1x.webp 1x,
            ./img/main/moneyTree/moneyTree-1440-2x.webp 2x
          "
          type="image/webp"
          media="(min-width: 1440px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-1440-1x.jpg 1x,
            ./img/main/moneyTree/moneyTree-1440-2x.jpg 2x
          "
          media="(min-width: 1440px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-768-1x.avif 1x,
            ./img/main/moneyTree/moneyTree-768-2x.avif 2x
          "
          type="image/avif"
          media="(min-width: 768px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-768-1x.webp 1x,
            ./img/main/moneyTree/moneyTree-768-2x.webp 2x
          "
          type="image/webp"
          media="(min-width: 768px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-768-1x.jpg 1x,
            ./img/main/moneyTree/moneyTree-768-2x.jpg 2x
          "
          media="(min-width: 768px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-320-1x.avif 1x,
            ./img/main/moneyTree/moneyTree-320-2x.avif 2x
          "
          type="image/avif"
          media="(max-width: 767.9px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-320-1x.webp 1x,
            ./img/main/moneyTree/moneyTree-320-2x.webp 2x
          "
          type="image/webp"
          media="(max-width: 767.9px)"
        />
        <source
          srcset="
            ./img/main/moneyTree/moneyTree-320-1x.jpg 1x,
            ./img/main/moneyTree/moneyTree-320-2x.jpg 2x
          "
          media="(max-width: 767.9px)"
        />
        <img
          src="./img/main/moneyTree/moneyTree-320-1x.jpg"
          class="main-info__img"
          alt="money tree"
          loading="lazy"
        />
      </picture>
    </div>
    <a class="main-info__btn" href="/formProfile">
      Доєднатись
      <svg class="main-info__btn-img">
        <use href="./img/universal/arrowUp.svg#arrowUp"></use>
      </svg>
    </a>
  </div>
</section>
